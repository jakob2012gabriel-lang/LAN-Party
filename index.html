<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN-Party Einkaufsliste</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --card-border: #21262d;
            --accent-green: #00e676;
            --accent-cyan: #00e5ff;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --danger: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            padding-bottom: 80px;
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 10px;
            background: linear-gradient(135deg, rgba(0,230,118,0.1), rgba(0,229,255,0.05));
            border-radius: 16px;
            border: 1px solid rgba(0,230,118,0.2);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0,230,118,0.3);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        .progress-container {
            margin: 15px 0 5px 0;
            background-color: #21262d;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-cyan));
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-align: right;
            margin-bottom: 15px;
        }

        .category-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .category-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--accent-cyan);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .item-list {
            list-style: none;
        }

        .item-row {
            display: flex;
            flex-direction: column;
            background-color: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .item-row.checked {
            opacity: 0.5;
            background-color: rgba(0,0,0,0.2);
            border-color: transparent;
        }

        .item-row.checked .item-name {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .item-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex-grow: 1;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-cyan);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .item-row.checked .custom-checkbox {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .custom-checkbox::after {
            content: '✓';
            color: #000;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }

        .item-row.checked .custom-checkbox::after {
            display: block;
        }

        .item-name {
            font-weight: 600;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: var(--text-main);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .qty-btn:active {
            background-color: var(--accent-cyan);
            color: #000;
        }

        .qty-val {
            font-size: 0.9rem;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .item-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px dashed rgba(255,255,255,0.05);
            font-size: 0.8rem;
        }

        .assignee-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: var(--accent-green);
            padding: 4px 8px;
            font-size: 0.8rem;
            width: 140px;
            outline: none;
        }

        .assignee-input::placeholder {
            color: #484f58;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #484f58;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 6px;
        }

        .delete-btn:hover {
            color: var(--danger);
        }

        .add-form {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .add-form-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-sub);
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"], select {
            background: #0d1117;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-cyan);
        }

        select {
            width: 40%;
        }

        .add-btn {
            background: linear-gradient(135deg, var(--accent-green), #00b0ff);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            padding: 10px 15px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .add-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1>LAN Party</h1>
        <div class="subtitle">Interaktive Einkaufs- & Snackliste</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">0% besorgt</div>
    </header>

    <div id="categoriesContainer"></div>

    <div class="add-form">
        <div class="add-form-title">⚡ Neues Item hinzufügen</div>
        <div class="input-group">
            <input type="text" id="newItemName" placeholder="Artikel (z.B. Monster Energy)" style="flex-grow: 1;">
            <select id="newItemCategory">
                <option value="Getränke">Getränke</option>
                <option value="Snacks">Snacks</option>
                <option value="Süßigkeiten">Süßigkeiten</option>
                <option value="Herzhaft">Herzhaft</option>
            </select>
        </div>
        <button class="add-btn" onclick="addItem()">HINZUFÜGEN</button>
    </div>
